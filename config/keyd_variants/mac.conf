# ------------------------------------------------------
# USB KEYBOARD ONLY (Hailuck / Apple Clone)
# ------------------------------------------------------
# This ID matches HAILUCK USB Keyboard
[ids]
05ac:024f
*HAILUCK*

[main]
# ==========================================================
# MODE B: MAC HARDWARE (The Fix)
# ==========================================================

# --- Left Side (Mac Swap) ---
leftalt = leftmeta
leftmeta = leftalt

# --- Right Side (Danish Fix) ---
rightalt = rightcontrol
rightmeta = rightalt

# --- ISO Key Fix (The < > and ½ § Swap) ---
# Swaps the key under ESC with the key next to Shift
grave = 102nd
102nd = grave

# F1: Keyboard sends 'brightnessdown' -> You want Mute
brightnessdown = mute

# F2: Keyboard sends 'brightnessup' -> You want Volume Down
brightnessup = volumedown

# F3: Keyboard sends 'scale' (Mission Control) -> You want Volume Up
# (Check 'keyd monitor' if F3 isn't 'scale')
scale = volumeup

# F4: Keyboard sends 'dashboard' (Launchpad) -> You want Mic Mute
dashboard = micmute

# F5: Keyboard sends 'f5' (usually empty on Apple) -> Brightness Down
f5 = brightnessdown

# F6: Keyboard sends 'f6' -> Brightness Up
f6 = brightnessup

# F7: Keyboard sends 'rewind' (Media) -> Play/Pause
rewind = playpause

# F8: Keyboard sends 'playpause' -> Next
playpause = nextsong
