[main]
# ==========================================================
# MODE A: WINDOW HARDWARE DEFAULT
# ==========================================================

rightmeta = rightalt

# F1: Keyboard sends 'brightnessdown' -> You want Mute
brightnessdown = mute

# F2: Keyboard sends 'brightnessup' -> You want Volume Down
brightnessup = volumedown

# F3: Keyboard sends 'scale' (Mission Control) -> You want Volume Up
# (Check 'keyd monitor' if F3 isn't 'scale')
scale = volumeup

# F4: Keyboard sends 'dashboard' (Launchpad) -> You want Mic Mute
dashboard = micmute

# F5 (Symbol |<) sends 'previoussong' -> Map to Brightness Down
kbdillumdown = brightnessdown

# F6 (Symbol >||) sends 'playpause' -> Map to Brightness Up
kbdillumup = brightnessup

# F7 (Symbol >|) sends 'nextsong' -> Map to Play/Pause
previoussong = playpause
